# ============================================================
# 쥴리씨 자사몰 — Next.js 앱 (VPS, 76.13.187.38)
#
# 같은 VPS 에 self-hosted Supabase(jullyssy-cutover-*) 가 떠 있지만 앱은 공개 URL
# (https://api.jullyssy.shop) 로 붙으므로 compose 네트워크를 공유하지 않는다.
# 앱은 127.0.0.1:3001 에만 바인딩 — 외부 노출은 jullyssy-edge Caddy(/etc/jullyssy-edge/Caddyfile) 가 담당.
#
# 사용 (VPS, /srv/jullyssy/app 기준):
#   cp deploy/env.app.example deploy/.env.app   # 값 채우기, chmod 600
#   docker compose -f deploy/docker-compose.app.yml up -d --build
#
# .env.app 은 두 군데서 쓰인다:
#   1) build secret  — next build 가 Vercel 처럼 모든 env 를 보도록 (이미지에 남지 않음)
#   2) env_file      — 런타임 환경변수
# ============================================================

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      secrets:
        - env_app
    image: jullyssy-mall:latest
    container_name: jullyssy-app
    env_file:
      - .env.app
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1g

secrets:
  env_app:
    file: ./.env.app
