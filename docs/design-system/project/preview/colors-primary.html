<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Primary — Warm Orange</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-sans);color:var(--gray-900)}
  .row{display:flex;gap:8px;align-items:flex-end}
  .sw{flex:1;border-radius:8px;border:1px solid var(--gray-100);padding:10px;min-height:80px;display:flex;flex-direction:column;justify-content:flex-end}
  .tone{font-size:10px;color:var(--gray-500);font-family:ui-monospace,Menlo,monospace}
  .lbl{font-size:11px;font-weight:600;margin-top:2px}
  .note{font-size:11px;color:var(--gray-500);margin-top:14px;line-height:1.5}
  .dot{display:inline-block;width:10px;height:10px;border-radius:999px;background:var(--primary);vertical-align:-1px;margin-right:4px}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#FFF4ED;"><div class="tone">50</div><div class="lbl" style="color:#7A3E0D">#FFF4ED</div></div>
  <div class="sw" style="background:#FFE6D5;"><div class="tone">100</div><div class="lbl" style="color:#7A3E0D">#FFE6D5</div></div>
  <div class="sw" style="background:#FFC8A3;"><div class="tone">200</div><div class="lbl">#FFC8A3</div></div>
  <div class="sw" style="background:#FFA46B;"><div class="tone">300</div><div class="lbl">#FFA46B</div></div>
  <div class="sw" style="background:#FF853A;color:#fff"><div class="tone" style="color:#fff9">400</div><div class="lbl">#FF853A</div></div>
  <div class="sw" style="background:#F97316;color:#fff;outline:2px solid #F97316;outline-offset:2px"><div class="tone" style="color:#fff9">500 · DEFAULT</div><div class="lbl">#F97316</div></div>
  <div class="sw" style="background:#E85D04;color:#fff"><div class="tone" style="color:#fff9">600 · hover</div><div class="lbl">#E85D04</div></div>
  <div class="sw" style="background:#BE4A04;color:#fff"><div class="tone" style="color:#fff9">700</div><div class="lbl">#BE4A04</div></div>
</div>
<p class="note"><span class="dot"></span>Use ≤ 2 spots per viewport. CTA, 활성 pill, 할인 %, 검색 focus ring, 쥴리씨 wordmark.</p>
</body></html>
