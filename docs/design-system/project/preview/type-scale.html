<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Scale</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-sans);color:var(--gray-900);letter-spacing:-.01em}
 .row{display:grid;grid-template-columns:220px 1fr 180px;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid #F4F4F5}
 .row:last-child{border:0}
 .tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray-500)}
 .spec{font-size:10px;font-family:ui-monospace,Menlo,monospace;color:var(--gray-500);text-align:right}
</style></head><body>
<div class="row"><div class="tag">H1 · page</div><div style="font-size:28px;font-weight:700;line-height:1.3">페이지 제목입니다</div><div class="spec">28 / 700 / 1.3</div></div>
<div class="row"><div class="tag">H2 · section</div><div style="font-size:20px;font-weight:700;line-height:1.3">섹션 제목</div><div class="spec">20 / 700 / 1.3</div></div>
<div class="row"><div class="tag">H3 · card</div><div style="font-size:16px;font-weight:600">카드 제목</div><div class="spec">16 / 600</div></div>
<div class="row"><div class="tag">Body</div><div style="font-size:14px;line-height:1.5;color:var(--gray-700)">화면 너머의 여러분에게 따뜻한 쇼핑메이트가 되겠습니다.</div><div class="spec">14 / 400 / 1.5</div></div>
<div class="row"><div class="tag">Product name</div><div style="font-size:14px;color:var(--gray-700)">얼굴소멸 로맨틱 실루엣 니트 배색 레이어드 셔츠</div><div class="spec">14 / 400</div></div>
<div class="row"><div class="tag">Price · sale</div><div style="font-size:16px;font-weight:700">43,900원</div><div class="spec">16 / 700</div></div>
<div class="row"><div class="tag">Meta</div><div style="font-size:12px;color:var(--gray-500)">지금 막 도착한 신상품</div><div class="spec">12 / 400</div></div>
<div class="row"><div class="tag">Tab label</div><div style="font-size:10px;font-weight:500">장바구니</div><div class="spec">10 / 500</div></div>
</body></html>
