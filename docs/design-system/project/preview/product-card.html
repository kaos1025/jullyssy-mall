<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Product Card</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-sans);color:var(--gray-900);letter-spacing:-.01em}
 .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:640px}
 .card .img{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#EFE7DD,#D9CEC0)}
 .card.b .img{background:linear-gradient(135deg,#E8DCCF,#C8B99A)}
 .card.c .img{background:linear-gradient(135deg,#F2E7DC,#E0C8B4)}
 .new{position:absolute;top:8px;left:8px;background:#0A0A0A;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
 .disc{position:absolute;top:8px;right:8px;background:#F97316;color:#fff;font-size:11px;font-weight:700;width:36px;height:36px;border-radius:9999px;display:flex;align-items:center;justify-content:center}
 .sold{position:absolute;inset:0;background:rgba(0,0,0,.5);color:#fff;font-weight:700;letter-spacing:.15em;font-size:13px;display:flex;align-items:center;justify-content:center}
 .info{margin-top:10px}
 .price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
 .strike{font-size:12px;color:#9CA3AF;text-decoration:line-through}
 .final{font-size:14px;font-weight:700}
 .ship{font-size:11px;color:#F97316;margin-top:2px}
 .name{font-size:13px;color:#4B5563;margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 .dots{display:flex;gap:4px;margin-top:6px}
 .dot{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,.1)}
</style></head><body>
<div class="grid">
  <div class="card">
    <div class="img"><span class="new">NEW</span><span class="disc">-12%</span></div>
    <div class="info">
      <div class="price"><span class="strike">50,000원</span><span class="final">43,900원</span></div>
      <div class="ship">무료배송</div>
      <div class="name">얼굴소멸 로맨틱 실루엣 니트 배색 레이어드 셔츠</div>
      <div class="dots"><span class="dot" style="background:#000"></span><span class="dot" style="background:#D4C5B0"></span></div>
    </div>
  </div>
  <div class="card b">
    <div class="img"><span class="disc">-8%</span></div>
    <div class="info">
      <div class="price"><span class="final">74,000원</span></div>
      <div class="name">국내생산 라운드넥 금장단추 하객룩 오피스룩 블랙 아이보리</div>
      <div class="dots"><span class="dot" style="background:#FFFDD0"></span><span class="dot" style="background:#000"></span></div>
    </div>
  </div>
  <div class="card c">
    <div class="img"><div class="sold">SOLD OUT</div></div>
    <div class="info">
      <div class="price"><span class="final">29,000원</span></div>
      <div class="name">데일리 코튼 스트레이트핏 티셔츠</div>
      <div class="dots"><span class="dot" style="background:#C19A6B"></span><span class="dot" style="background:#FFFFFF"></span><span class="dot" style="background:#1B2A4A"></span></div>
    </div>
  </div>
</div>
