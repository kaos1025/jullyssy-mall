<!-- Shared base for all preview cards -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<title>base</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-sans); color: var(--gray-900); }
  body { padding: 20px 24px; box-sizing: border-box; }
  * { box-sizing: border-box; }
  .row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .swatch { width: 72px; height: 72px; border-radius: 8px; border: 1px solid var(--gray-100); }
  .swatch-lbl { font-size: 11px; color: var(--gray-900); font-weight: 600; }
  .swatch-sub { font-size: 10px; color: var(--gray-500); font-family: ui-monospace, Menlo, monospace; }
</style></head><body></body></html>
