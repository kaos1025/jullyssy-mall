<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Neutrals</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="../colors_and_type.css">
<style>
 html,body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-sans);color:var(--gray-900)}
 .row{display:flex;gap:6px}
 .sw{flex:1;border-radius:8px;border:1px solid #EEE;padding:8px;min-height:78px;display:flex;flex-direction:column;justify-content:space-between}
 .role{font-size:10px;color:var(--gray-500)}
 .hex{font-size:10px;font-family:ui-monospace,Menlo,monospace;color:var(--gray-500)}
 .name{font-size:11px;font-weight:600}
 .note{font-size:11px;color:var(--gray-500);margin-top:12px}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#FFFFFF"><div class="role">base bg</div><div><div class="name">white</div><div class="hex">#FFFFFF</div></div></div>
  <div class="sw" style="background:#FAFAFA"><div class="role">subtle</div><div><div class="name">gray-50</div><div class="hex">#FAFAFA</div></div></div>
  <div class="sw" style="background:#F4F4F5"><div class="role">pill bg</div><div><div class="name">gray-100</div><div class="hex">#F4F4F5</div></div></div>
  <div class="sw" style="background:#E8E8E8"><div class="role">border</div><div><div class="name">gray-200</div><div class="hex">#E8E8E8</div></div></div>
  <div class="sw" style="background:#9CA3AF;color:#fff"><div class="role" style="color:#fff9">muted icon</div><div><div class="name">gray-400</div><div class="hex" style="color:#fffc">#9CA3AF</div></div></div>
  <div class="sw" style="background:#6B7280;color:#fff"><div class="role" style="color:#fff9">meta text</div><div><div class="name">gray-500</div><div class="hex" style="color:#fffc">#6B7280</div></div></div>
  <div class="sw" style="background:#374151;color:#fff"><div class="role" style="color:#fff9">body</div><div><div class="name">gray-700</div><div class="hex" style="color:#fffc">#374151</div></div></div>
  <div class="sw" style="background:#171717;color:#fff"><div class="role" style="color:#fff9">heading</div><div><div class="name">gray-900</div><div class="hex" style="color:#fffc">#171717</div></div></div>
</div>
<p class="note">White dominates. 80%+ of viewport should be white or gray-50.</p>
</body></html>
