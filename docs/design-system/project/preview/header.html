<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Header</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
 html,body{margin:0;padding:20px;background:#F4F4F5;font-family:'Pretendard Variable',system-ui;color:#171717;letter-spacing:-.01em}
 .dev{background:#fff;border-radius:8px;overflow:hidden;border:1px solid #E8E8E8;margin-bottom:12px}
 .hdr{display:flex;align-items:center;height:56px;padding:0 16px;gap:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);box-shadow:0 1px 2px rgba(0,0,0,.04)}
 .logo{font-family:'Cormorant Garamond',serif;font-weight:500;color:#F97316;font-size:22px;letter-spacing:.12em}
 .spacer{flex:1}
 .hdr svg{width:20px;height:20px;color:#171717}
 .cats{display:flex;gap:18px;height:40px;align-items:center;padding:0 16px;font-size:13px;color:#374151;overflow-x:auto;border-top:1px solid #F4F4F5;background:#fff;white-space:nowrap}
 .cats::-webkit-scrollbar{display:none}
 .cats .on{color:#171717;font-weight:500}
 .cats .off{color:#6B7280}
 /* desktop variant */
 .hdr-d{display:flex;align-items:center;height:56px;padding:0 24px;gap:16px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
 .search{flex:1;max-width:380px;margin:0 auto;position:relative}
 .search input{width:100%;height:34px;background:#F4F4F5;border:0;border-radius:999px;padding:0 14px 0 34px;font-size:13px;font-family:inherit;color:#171717;letter-spacing:-.01em}
 .search input::placeholder{color:#9CA3AF}
 .search svg{position:absolute;left:11px;top:8px;width:16px;height:16px;color:#9CA3AF}
 .right-ic{display:flex;gap:14px;color:#374151;font-size:13px;align-items:center}
 .nav{display:flex;gap:22px;height:44px;align-items:center;padding:0 24px;border-top:1px solid #F4F4F5;font-size:13px;background:#fff;white-space:nowrap}
 .label{font-size:10px;color:#6B7280;padding:4px 8px;font-family:ui-monospace,Menlo,monospace}
</style></head><body>

<div class="dev">
  <div class="label">MOBILE · 56px</div>
  <div class="hdr">
    <i data-lucide="menu"></i>
    <span class="logo">쥴리씨</span>
    <div class="spacer"></div>
    <i data-lucide="search"></i>
    <i data-lucide="shopping-bag"></i>
  </div>
  <div class="cats">
    <span class="on">전체</span><span class="off">상의</span><span class="off">하의</span><span class="off">아우터</span><span class="off">원피스/세트</span><span class="off">가방/악세서리</span>
  </div>
</div>

<div class="dev">
  <div class="label">DESKTOP · 56 + 44</div>
  <div class="hdr-d">
    <span class="logo">쥴리씨</span>
    <div class="search"><i data-lucide="search"></i><input placeholder="상품을 검색하세요" /></div>
    <div class="right-ic">
      <span>로그인</span>
      <i data-lucide="search"></i>
      <i data-lucide="user"></i>
      <i data-lucide="shopping-bag"></i>
    </div>
  </div>
  <nav class="nav">
    <span style="font-weight:500">전체상품</span><span style="color:#6B7280">상의</span><span style="color:#6B7280">하의</span><span style="color:#6B7280">아우터</span><span style="color:#6B7280">원피스/세트</span><span style="color:#6B7280">가방/악세서리</span>
  </nav>
</div>

<script>lucide.createIcons({attrs:{'stroke-width':1.5}});</script>
</body></html>
